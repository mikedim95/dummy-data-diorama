services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: wam
      POSTGRES_USER: wam
      POSTGRES_PASSWORD: ${WAM_POSTGRES_PASSWORD:?Set WAM_POSTGRES_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wam_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wam -d wam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wam_postgres:
