projects:
  - name: WAM
    environments:
      - name: Preview
        services:
          - type: web
            name: wam-v4-preview
            runtime: node
            plan: free
            region: frankfurt
            repo: https://github.com/mikedim95/dummy-data-diorama
            branch: codex/wam-v4-backend
            buildCommand: npm ci --include=dev && npm run build
            startCommand: npm run start:render
            healthCheckPath: /api/wam/health
            envVars:
              - key: NODE_VERSION
                value: 22.20.0
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
              - key: TZ
                value: Europe/Athens
              - key: WAM_LOCAL_DEMO
                value: "false"
              - key: WAM_PREVIEW_MODE
                value: "true"
              - key: WAM_SEED_PREVIEW
                value: "true"
              - key: WAM_PHOTO_STORAGE
                value: database
              - key: WAM_PUBLIC_ORIGIN
                sync: false
              - key: WAM_SESSION_SECRET
                generateValue: true
              - key: WAM_PREVIEW_ADMIN_PASSWORD
                generateValue: true
              - key: WAM_PREVIEW_OPERATOR_PASSWORD
                generateValue: true
              - key: DATABASE_URL
                fromDatabase:
                  name: wam-v4-preview-db
                  property: connectionString
        databases:
          - name: wam-v4-preview-db
            plan: free
            region: frankfurt
            postgresMajorVersion: "17"
            ipAllowList: []
